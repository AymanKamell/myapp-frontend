name: Frontend Linting

on:
  workflow_call:

jobs:
  lint:
    name: Frontend Linting
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install HTMLHint
        run: npm install --global htmlhint

      - name: Run HTMLHint
        id: htmlhint
        continue-on-error: true
        run: |
          htmlhint frontend-application/index.html \
            > htmlhint-report.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Run Hadolint
        id: hadolint
        continue-on-error: true
        run: |
          docker run --rm -i \
            hadolint/hadolint:latest \
            hadolint - \
            < frontend-application/Dockerfile \
            > hadolint-report.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Validate NGINX configuration
        id: nginx
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$PWD/frontend-application/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:alpine \
            nginx -t \
            > nginx-report.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Generate lint report
        if: always()
        run: |
          {
            echo "<html>"
            echo "<head><title>Frontend Linting Report</title></head>"
            echo "<body>"
            echo "<h1>Frontend Linting Report</h1>"

            echo "<h2>HTMLHint</h2>"
            echo "<pre>"
            cat htmlhint-report.txt
            echo "</pre>"

            echo "<h2>Hadolint</h2>"
            echo "<pre>"
            cat hadolint-report.txt
            echo "</pre>"

            echo "<h2>NGINX Configuration</h2>"
            echo "<pre>"
            cat nginx-report.txt
            echo "</pre>"

            echo "</body>"
            echo "</html>"
          } > frontend-lint-report.html

      - name: Generate lint summary
        if: always()
        env:
          HTMLHINT_EXIT_CODE: ${{ steps.htmlhint.outputs.exit_code }}
          HADOLINT_EXIT_CODE: ${{ steps.hadolint.outputs.exit_code }}
          NGINX_EXIT_CODE: ${{ steps.nginx.outputs.exit_code }}
        run: |
          if [ "$HTMLHINT_EXIT_CODE" = "0" ]; then
            HTML_STATUS="PASS"
          else
            HTML_STATUS="FAIL"
          fi

          if [ "$HADOLINT_EXIT_CODE" = "0" ]; then
            DOCKERFILE_STATUS="PASS"
          else
            DOCKERFILE_STATUS="FAIL"
          fi

          if [ "$NGINX_EXIT_CODE" = "0" ]; then
            NGINX_STATUS="PASS"
          else
            NGINX_STATUS="FAIL"
          fi

          if [ "$HTML_STATUS" = "PASS" ] &&
             [ "$DOCKERFILE_STATUS" = "PASS" ] &&
             [ "$NGINX_STATUS" = "PASS" ]; then
            GATE="PASSED"
          else
            GATE="FAILED"
          fi

          {
            echo "## Frontend Linting Report"
            echo ""
            echo "| Control | Tool | Status |"
            echo "|---|---|---|"
            echo "| HTML | HTMLHint | $HTML_STATUS |"
            echo "| Dockerfile | Hadolint | $DOCKERFILE_STATUS |"
            echo "| NGINX Configuration | nginx -t | $NGINX_STATUS |"
            echo "| Lint Gate | | $GATE |"
            echo ""
            echo "### Reports"
            echo ""
            echo "| Artifact | Status |"
            echo "|---|---|"
            echo "| frontend-lint-report.html | GENERATED |"
            echo "| Raw validation reports | GENERATED |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-lint-reports
          path: |
            frontend-lint-report.html
            htmlhint-report.txt
            hadolint-report.txt
            nginx-report.txt
          if-no-files-found: error

      - name: Enforce lint gate
        if: always()
        env:
          HTMLHINT_EXIT_CODE: ${{ steps.htmlhint.outputs.exit_code }}
          HADOLINT_EXIT_CODE: ${{ steps.hadolint.outputs.exit_code }}
          NGINX_EXIT_CODE: ${{ steps.nginx.outputs.exit_code }}
        run: |
          if [ "$HTMLHINT_EXIT_CODE" != "0" ] ||
             [ "$HADOLINT_EXIT_CODE" != "0" ] ||
             [ "$NGINX_EXIT_CODE" != "0" ]; then
            echo "Frontend lint gate FAILED."
            exit 1
          fi

          echo "Frontend lint gate PASSED."
